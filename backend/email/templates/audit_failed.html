<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px; border: 1px solid #cbd5e1; }
    .header { text-align: center; border-bottom: 2px solid #64748b; padding-bottom: 16px; margin-bottom: 24px; }
    .title { color: #475569; font-size: 22px; font-weight: bold; margin: 0; }
    .btn { display: inline-block; padding: 12px 24px; background-color: #004ac6; color: #ffffff; text-decoration: none; font-weight: bold; border-radius: 12px; margin-top: 20px; }
    .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 32px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">❌ Audit Execution Encountered an Issue</h1>
    </div>
    <h2>Audit Execution Failed for Audit #{{ audit_id }}</h2>
    <p>Error Detail: <code>{{ error }}</code></p>
    <p>You can re-trigger document processing or select another PDF file from the processing hub.</p>
    <a href="http://localhost:3001/processing" class="btn">Retry Audit Execution</a>
    <div class="footer">
      Corporate Auditor AI Suite • Support & Failure Subsystem
    </div>
  </div>
</body>
</html>
